# Render Blueprint — one-click deployment for F&O Intraday Intelligence.
# Docs: https://render.com/docs/blueprint-spec
#
# Deploy: New + → Blueprint → connect this repository.
# Render provisions PostgreSQL, injects DATABASE_URL, builds the Next.js app,
# generates the at-rest encryption key, and health-checks /api/health.
services:
  - type: web
    name: fno-intraday-intelligence
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci && npm run build
    startCommand: npm start -- -H 0.0.0.0 -p $PORT
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    numInstances: 1
    envVars:
      - key: NODE_VERSION
        value: 22.23.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: fno-intelligence-db
          property: connectionString
      # AES-256-GCM key source for the server-side Upstox token. Render
      # generates this once and keeps it out of source/client bundles.
      - key: TOKEN_ENCRYPTION_KEY
        generateValue: true
      # REST polling controls. These defaults refresh the complete F&O quote
      # universe in <=100-key batches without aggressive provider traffic.
      - key: POLL_QUOTES_MS
        value: "10000"
      - key: POLL_SCANNER_MS
        value: "12000"
      - key: POLL_CHAIN_MS
        value: "20000"
      - key: POLL_BACKFILL_MS
        value: "300000"
      - key: POLL_CLOSED_QUOTES_MS
        value: "300000"
      - key: QUOTE_BATCH_SIZE
        value: "100"
      - key: RATE_LIMIT_RPS
        value: "25"
      - key: RATE_LIMIT_BURST
        value: "25"
      - key: POLL_MAX_KEYS_PER_CYCLE
        value: "600"

databases:
  - name: fno-intelligence-db
    plan: free
    region: singapore
    databaseName: fno_intelligence
    user: fno_app
    ipAllowList: []
